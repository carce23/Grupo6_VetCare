<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

    <body>

        <section th:fragment="formulario">

            <div class="container mt-4">

                <div class="d-flex justify-content-between align-items-center">

                    <h2>[[#{usuario.listado}]]</h2>

                    <button type="button"
                            class="btn btn-primary"
                            data-bs-toggle="modal"
                            data-bs-target="#agregarUsuario">
                        [[#{usuario.agregar}]]
                    </button>

                </div>

                <hr/>

                <div th:if="${todoOk}"
                     class="alert alert-success"
                     th:text="${todoOk}"></div>

                <div th:if="${error}"
                     class="alert alert-danger"
                     th:text="${error}"></div>

            </div>

            <div class="modal fade"
                 id="agregarUsuario"
                 tabindex="-1"
                 aria-hidden="true">

                <div class="modal-dialog">
                    <div class="modal-content">

                        <form th:action="@{/usuario/guardar}"
                              method="post">

                            <div class="modal-header">

                                <h5 class="modal-title">
                                    [[#{usuario.agregar}]]
                                </h5>

                                <button type="button"
                                        class="btn-close"
                                        data-bs-dismiss="modal">
                                </button>

                            </div>

                            <div class="modal-body">

                                <div class="mb-3">
                                    <label class="form-label">
                                        [[#{usuario.nombre}]]
                                    </label>

                                    <input type="text"
                                           name="nombre"
                                           class="form-control"
                                           maxlength="100"
                                           required/>
                                </div>

                                <div class="mb-3">
                                    <label class="form-label">
                                        [[#{usuario.correo}]]
                                    </label>

                                    <input type="email"
                                           name="correo"
                                           class="form-control"
                                           maxlength="150"
                                           required/>
                                </div>

                                <div class="mb-3">
                                    <label class="form-label">
                                        [[#{usuario.rol}]]
                                    </label>

                                    <select name="rol"
                                            class="form-select"
                                            required>

                                        <option value="CLIENTE">
                                            Cliente
                                        </option>

                                        <option value="VETERINARIO">
                                            Veterinario
                                        </option>

                                        <option value="ADMIN">
                                            Administrador
                                        </option>

                                    </select>
                                </div>

                                <div class="form-check">

                                    <input type="hidden"
                                           name="_estado"
                                           value="on"/>

                                    <input type="checkbox"
                                           name="estado"
                                           value="true"
                                           id="estadoNuevo"
                                           class="form-check-input"
                                           checked/>

                                    <label class="form-check-label"
                                           for="estadoNuevo">
                                        [[#{usuario.estado}]]
                                    </label>

                                </div>

                            </div>

                            <div class="modal-footer">

                                <button type="button"
                                        class="btn btn-secondary"
                                        data-bs-dismiss="modal">
                                    [[#{accion.cancelar}]]
                                </button>

                                <button type="submit"
                                        class="btn btn-primary">
                                    [[#{accion.guardar}]]
                                </button>

                            </div>

                        </form>

                    </div>
                </div>
            </div>

        </section>


        <section th:fragment="listado">

            <div class="container mt-4">

                <p>
                    <strong>[[#{usuario.total}]]:</strong>
                    <span th:text="${totalUsuarios}">0</span>
                </p>

                <div class="table-responsive">

                    <table class="table table-striped table-hover">

                        <thead class="table-dark">

                            <tr>
                                <th>ID</th>
                                <th>[[#{usuario.nombre}]]</th>
                                <th>[[#{usuario.correo}]]</th>
                                <th>[[#{usuario.rol}]]</th>
                                <th>[[#{usuario.estado}]]</th>
                                <th>[[#{accion.acciones}]]</th>
                            </tr>

                        </thead>

                        <tbody>

                            <tr th:each="usuario : ${usuarios}">

                                <td th:text="${usuario.idUsuario}"></td>

                                <td th:text="${usuario.nombre}"></td>

                                <td th:text="${usuario.correo}"></td>

                                <td th:text="${usuario.rol}"></td>

                                <td>
                                    <span th:if="${usuario.estado}"
                                          class="badge bg-success">
                                        [[#{usuario.activo}]]
                                    </span>

                                    <span th:unless="${usuario.estado}"
                                          class="badge bg-secondary">
                                        [[#{usuario.inactivo}]]
                                    </span>
                                </td>

                                <td>

                                    <div class="d-flex gap-2">

                                        <button type="button"
                                                class="btn btn-warning btn-sm"
                                                data-bs-toggle="modal"
                                                th:attr="data-bs-target=|#editarUsuario${usuario.idUsuario}|">
                                            [[#{accion.editar}]]
                                        </button>

                                        <form th:action="@{/usuario/eliminar}"
                                              method="post"
                                              onsubmit="return confirm('¿Deseas eliminar este usuario?');">

                                            <input type="hidden"
                                                   name="idUsuario"
                                                   th:value="${usuario.idUsuario}"/>

                                            <button type="submit"
                                                    class="btn btn-danger btn-sm">
                                                [[#{accion.eliminar}]]
                                            </button>

                                        </form>

                                    </div>

                                </td>

                            </tr>

                            <tr th:if="${#lists.isEmpty(usuarios)}">

                                <td colspan="6"
                                    class="text-center">
                                    [[#{usuario.vacio}]]
                                </td>

                            </tr>

                        </tbody>

                    </table>

                </div>

            </div>


            <div th:each="usuario : ${usuarios}"
                 class="modal fade"
                 th:id="|editarUsuario${usuario.idUsuario}|"
                 tabindex="-1"
                 aria-hidden="true">

                <div class="modal-dialog">

                    <div class="modal-content">

                        <form th:action="@{/usuario/guardar}"
                              method="post">

                            <input type="hidden"
                                   name="idUsuario"
                                   th:value="${usuario.idUsuario}"/>

                            <div class="modal-header">

                                <h5 class="modal-title">
                                    [[#{usuario.editar}]]
                                </h5>

                                <button type="button"
                                        class="btn-close"
                                        data-bs-dismiss="modal">
                                </button>

                            </div>

                            <div class="modal-body">

                                <div class="mb-3">

                                    <label class="form-label">
                                        [[#{usuario.nombre}]]
                                    </label>

                                    <input type="text"
                                           name="nombre"
                                           class="form-control"
                                           th:value="${usuario.nombre}"
                                           maxlength="100"
                                           required/>

                                </div>

                                <div class="mb-3">

                                    <label class="form-label">
                                        [[#{usuario.correo}]]
                                    </label>

                                    <input type="email"
                                           name="correo"
                                           class="form-control"
                                           th:value="${usuario.correo}"
                                           maxlength="150"
                                           required/>

                                </div>

                                <div class="mb-3">

                                    <label class="form-label">
                                        [[#{usuario.rol}]]
                                    </label>

                                    <select name="rol"
                                            class="form-select"
                                            required>

                                        <option value="CLIENTE"
                                                th:selected="${usuario.rol == 'CLIENTE'}">
                                            Cliente
                                        </option>

                                        <option value="VETERINARIO"
                                                th:selected="${usuario.rol == 'VETERINARIO'}">
                                            Veterinario
                                        </option>

                                        <option value="ADMIN"
                                                th:selected="${usuario.rol == 'ADMIN'}">
                                            Administrador
                                        </option>

                                    </select>

                                </div>

                                <div class="form-check">

                                    <input type="hidden"
                                           name="_estado"
                                           value="on"/>

                                    <input type="checkbox"
                                           name="estado"
                                           value="true"
                                           class="form-check-input"
                                           th:id="|estado${usuario.idUsuario}|"
                                           th:checked="${usuario.estado}"/>

                                    <label class="form-check-label"
                                           th:for="|estado${usuario.idUsuario}|">
                                        [[#{usuario.estado}]]
                                    </label>

                                </div>

                            </div>

                            <div class="modal-footer">

                                <button type="button"
                                        class="btn btn-secondary"
                                        data-bs-dismiss="modal">
                                    [[#{accion.cancelar}]]
                                </button>

                                <button type="submit"
                                        class="btn btn-primary">
                                    [[#{accion.guardar}]]
                                </button>

                            </div>

                        </form>

                    </div>

                </div>

            </div>

        </section>

    </body>
</html>
