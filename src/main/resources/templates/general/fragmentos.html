<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

    <head th:fragment="head">
        <meta charset="UTF-8"/>
        <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
        <title th:text="#{aplicacion.titulo}">VetCare</title>

        <link th:href="@{/webjars/bootstrap/5.3.8/css/bootstrap.min.css}"
              rel="stylesheet"/>

        <script th:src="@{/webjars/bootstrap/5.3.8/js/bootstrap.bundle.min.js}"
                defer></script>
    </head>

    <header th:fragment="header">
        <nav class="navbar navbar-expand-lg bg-light">
            <div class="container">

                <a class="navbar-brand" th:href="@{/}">
                    VetCare
                </a>

                <button class="navbar-toggler" type="button"
                        data-bs-toggle="collapse"
                        data-bs-target="#navbarMenu"
                        aria-controls="navbarMenu"
                        aria-expanded="false"
                        aria-label="Mostrar menú">
                    <span class="navbar-toggler-icon"></span>
                </button>

                <div class="collapse navbar-collapse" id="navbarMenu">
                    <ul class="navbar-nav">

                        <li class="nav-item">
                            <a class="nav-link" th:href="@{/}">
                                Inicio
                            </a>
                        </li>

                        <li class="nav-item">
                            <a class="nav-link"
                               th:href="@{/usuario/listado}">
                                Usuarios
                            </a>
                        </li>

                        <li class="nav-item">
                            <a class="nav-link"
                                th:href="@{/mascota/listado}">
                                Mascotas
                            </a>
                        </li>

                    </ul>
                </div>

            </div>
        </nav>
    </header>

    <footer th:fragment="footer" class="bg-light text-center p-3 mt-5">
        <p class="mb-0">
            VetCare - Derechos Reservados 2026
        </p>
    </footer>

</html>
