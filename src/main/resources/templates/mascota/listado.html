<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <title>Mascotas | VetCare</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">
</head>

<body class="bg-light">

<div class="container mt-5">

    <div class="d-flex justify-content-between align-items-center mb-4">
        <h2>Gestión de mascotas</h2>

        <a th:href="@{/mascota/nuevo}"
           class="btn btn-primary">
            Registrar mascota
        </a>
    </div>

    <div class="card shadow-sm">
        <div class="card-body">

            <div class="table-responsive">
                <table class="table table-striped table-hover">

                    <thead class="table-dark">
                        <tr>
                            <th>ID</th>
                            <th>Nombre</th>
                            <th>Especie</th>
                            <th>Raza</th>
                            <th>Edad</th>
                            <th>Cliente</th>
                            <th>Acciones</th>
                        </tr>
                    </thead>

                    <tbody>
                        <tr th:each="mascota : ${mascotas}">

                            <td th:text="${mascota.idMascota}"></td>
                            <td th:text="${mascota.nombre}"></td>
                            <td th:text="${mascota.especie}"></td>
                            <td th:text="${mascota.raza}"></td>
                            <td th:text="${mascota.edad}"></td>
                            <td th:text="${mascota.idCliente}"></td>

                            <td>
                                <a th:href="@{/mascota/editar/{id}(id=${mascota.idMascota})}"
                                   class="btn btn-warning btn-sm">
                                    Editar
                                </a>

                                <form th:action="@{/mascota/eliminar/{id}(id=${mascota.idMascota})}"
                                      method="post"
                                      style="display:inline">

                                    <button type="submit"
                                            class="btn btn-danger btn-sm"
                                            onclick="return confirm('¿Desea eliminar esta mascota?')">
                                        Eliminar
                                    </button>
                                </form>
                            </td>

                        </tr>

                        <tr th:if="${#lists.isEmpty(mascotas)}">
                            <td colspan="7" class="text-center">
                                No hay mascotas registradas.
                            </td>
                        </tr>

                    </tbody>
                </table>
            </div>

        </div>
    </div>

</div>

</body>
</html>
