<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <title>Formulario de mascota | VetCare</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">
</head>

<body class="bg-light">

<div class="container mt-5">

    <div class="card shadow-sm mx-auto" style="max-width: 600px">

        <div class="card-header bg-primary text-white">
            <h4 class="mb-0">Registro de mascota</h4>
        </div>

        <div class="card-body">

            <form th:action="@{/mascota/guardar}"
                  th:object="${mascota}"
                  method="post">

                <input type="hidden"
                       th:field="*{idMascota}">

                <div class="mb-3">
                    <label class="form-label">Nombre</label>
                    <input type="text"
                           th:field="*{nombre}"
                           class="form-control"
                           required>
                </div>

                <div class="mb-3">
                    <label class="form-label">Especie</label>
                    <select th:field="*{especie}"
                            class="form-select"
                            required>
                        <option value="">Seleccione una especie</option>
                        <option value="Perro">Perro</option>
                        <option value="Gato">Gato</option>
                        <option value="Otro">Otro</option>
                    </select>
                </div>

                <div class="mb-3">
                    <label class="form-label">Raza</label>
                    <input type="text"
                           th:field="*{raza}"
                           class="form-control"
                           required>
                </div>

                <div class="mb-3">
                    <label class="form-label">Edad</label>
                    <input type="number"
                           th:field="*{edad}"
                           class="form-control"
                           min="0"
                           required>
                </div>

                <div class="mb-3">
                    <label class="form-label">ID del cliente</label>
                    <input type="number"
                           th:field="*{idCliente}"
                           class="form-control"
                           min="1"
                           required>
                </div>

                <div class="d-flex justify-content-between">

                    <a th:href="@{/mascota/listado}"
                       class="btn btn-secondary">
                        Cancelar
                    </a>

                    <button type="submit"
                            class="btn btn-success">
                        Guardar mascota
                    </button>

                </div>

            </form>

        </div>
    </div>

</div>

</body>
</html>
